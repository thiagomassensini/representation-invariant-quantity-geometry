name: Formalization CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  foundation:
    name: Foundation — zero axioms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build zero-axiom foundation
        working-directory: foundation
        run: lake build --wfail

      - name: Audit foundational axiom surface
        run: |
          mkdir -p artifacts
          cd foundation
          lake env lean RIQGFoundation/Audit.lean | tee ../artifacts/foundation-axioms.txt
          cd ..
          python scripts/check_axioms.py --mode foundation artifacts/foundation-axioms.txt

  analysis:
    name: Analysis — pinned Mathlib and restricted axioms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned analysis dependencies
        working-directory: analysis
        run: lake update

      - name: Build analytic realization
        working-directory: analysis
        run: lake build --wfail

      - name: Audit analytic axiom surface
        run: |
          mkdir -p artifacts
          cd analysis
          lake env lean RIQG/Audit.lean | tee ../artifacts/analysis-axioms.txt
          cd ..
          python scripts/check_axioms.py --mode analysis artifacts/analysis-axioms.txt
